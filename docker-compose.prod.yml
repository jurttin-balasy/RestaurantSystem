services:
  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data_local:/var/lib/postgresql/data/
    env_file:
      - .env

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8080
    volumes:
      - .:/app
      - static_volume_local:/app/staticfiles
      - media_volume_local:/app/media
    expose:
      - "8080"
    depends_on:
      - db
    env_file:
      - .env

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume_local:/app/staticfiles
      - media_volume_local:/app/media
    depends_on:
      - web

volumes:
  postgres_data_local:
  static_volume_local:
  media_volume_local: