upstream django {
    # 'web' bu docker-compose'dagi servisning nomi, 8080 esa uning porti
    server web:8080; 
}

server {
    listen 80;
    server_name resto-table.uz www.resto-table.uz 209.38.103.206
    location / {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}