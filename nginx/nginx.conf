upstream django {
    server web:8080;        
}

# HTTP so'rovlarini avtomatik HTTPS'ga yo'naltirish
server {
    listen 80;
    server_name resto-table.uz www.resto-table.uz;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}



# # HTTPS (SSL) server sozlamasi
server {
    listen 443 ssl;
    server_name resto-table.uz www.resto-table.uz;

    ssl_certificate /etc/letsencrypt/live/resto-table.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resto-table.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location /static/ {
        alias /home/app/web/staticfiles/;
    }

    location /media/ {
        alias /home/app/web/media;
    }
}